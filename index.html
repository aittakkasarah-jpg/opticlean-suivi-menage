<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Suivi ménage · OptiClean</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #f2efeb;
  --dark: #1f3b44;
  --accent: #8fd3c7;
  --accent-dark: #4a9c8c;
  --white: #ffffff;
  --gray: #6b7280;
  --border: #d4cfc9;
  --warn: #c0392b;
  --warn-bg: #fdecea;
  --ok-bg: #eaf7f2;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--dark); font-size: 13px; line-height: 1.5; }

/* BARRE DU HAUT */
.toolbar {
  position: sticky; top: 0; z-index: 200;
  background: var(--dark); color: var(--white);
  padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand strong { font-size: 17px; font-weight: 700; }
.brand span { font-size: 12px; color: rgba(255,255,255,0.65); }

.onglets { display: flex; gap: 4px; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 3px; }
.onglet {
  border: none; background: transparent; color: rgba(255,255,255,0.75);
  padding: 7px 16px; border-radius: 6px; font-family: 'Inter', sans-serif;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.onglet.actif { background: var(--accent); color: var(--dark); }

.toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  padding: 8px 14px; border: none; border-radius: 6px;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.97); }
.btn-accent { background: var(--accent); color: var(--dark); }
.btn-ghost { background: rgba(255,255,255,0.1); color: var(--white); }
.btn-ghost:hover { background: rgba(255,255,255,0.2); }
.btn-outline { background: transparent; color: var(--dark); border: 1.5px solid var(--border); }
.btn-outline:hover { background: var(--bg); }
.btn-danger { background: transparent; color: var(--warn); }
.btn-danger:hover { background: var(--warn-bg); }
.btn-petit { padding: 5px 10px; font-size: 11px; }
input[type=file] { display: none; }

/* CONTENU */
.contenu { padding: 22px 28px 60px; max-width: 860px; margin: 0 auto; }

.bandeau-vide {
  background: var(--white); border: 1.5px dashed var(--border); border-radius: 10px;
  padding: 40px; text-align: center; color: var(--gray);
}
.bandeau-vide p { margin-bottom: 14px; }

.avertissement {
  background: var(--white); border-left: 3px solid var(--accent); border-radius: 8px;
  padding: 10px 16px; margin-bottom: 18px; font-size: 12px; color: var(--gray);
}
.avertissement strong { color: var(--dark); }

/* NAVIGATION PERIODE (semaine ou mois) */
.periode-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 20px; }
.periode-nav button.rond { background: var(--white); border: 1.5px solid var(--border); color: var(--dark); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; }
.periode-nav button.rond:hover { background: var(--accent); border-color: var(--accent); }
.periode-nav .periode-label { font-weight: 700; font-size: 15px; text-transform: capitalize; min-width: 220px; text-align: center; }
.lien-aujourdhui { background: none; border: none; color: var(--accent-dark); font-weight: 600; font-size: 11.5px; cursor: pointer; text-decoration: underline; }

/* VUE SEMAINE : agenda vertical */
.jour-bloc { background: var(--white); border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(31,59,68,0.05); overflow: hidden; }
.jour-bloc.aujourdhui { box-shadow: 0 4px 20px rgba(143,211,199,0.35); border: 1.5px solid var(--accent); }
.jour-entete { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.jour-bloc.aujourdhui .jour-entete { background: var(--accent); border-bottom-color: var(--accent); }
.jour-nom { font-weight: 700; font-size: 14px; text-transform: capitalize; }
.jour-bloc.aujourdhui .jour-nom { color: var(--dark); }
.jour-tag-aujourdhui { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; background: var(--dark); color: var(--white); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
.jour-compte { font-size: 11px; color: var(--gray); }
.jour-bloc.aujourdhui .jour-compte { color: var(--dark); opacity: 0.75; }

.jour-corps { padding: 6px 10px; }
.jour-vide { padding: 16px 8px; text-align: center; color: var(--gray); font-size: 12px; }

.entree {
  display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 8px;
  cursor: pointer;
}
.entree:hover { background: var(--bg); }
.entree-check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; background: var(--white); cursor: pointer;
}
.entree.fait .entree-check { background: var(--accent-dark); border-color: var(--accent-dark); color: var(--white); }
.entree-corps { flex: 1; min-width: 0; }
.entree-nom { font-weight: 600; font-size: 13px; }
.entree.fait .entree-nom { color: var(--gray); text-decoration: line-through; text-decoration-color: var(--border); }
.entree-heures { font-size: 11px; color: var(--gray); margin-top: 1px; }
.entree-manuelle-tag { font-size: 9.5px; color: var(--accent-dark); background: var(--ok-bg); padding: 1px 6px; border-radius: 8px; margin-left: 6px; text-transform: uppercase; letter-spacing: 0.4px; }
.entree-suppr { background: none; border: none; color: var(--gray); font-size: 15px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; }
.entree-suppr:hover { color: var(--warn); }

.ajout-jour { padding: 8px 10px 12px; }
.ajout-jour select { width: 100%; }

/* VUE MOIS : calendrier */
.mois-entetes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.mois-entetes div { text-align: center; font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--gray); letter-spacing: 0.4px; }
.mois-grille { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.mois-case {
  background: var(--white); border-radius: 8px; padding: 8px; min-height: 78px;
  cursor: pointer; border: 1.5px solid transparent; display: flex; flex-direction: column; gap: 6px;
}
.mois-case:hover { border-color: var(--accent); }
.mois-case.hors-mois { background: transparent; box-shadow: none; opacity: 0.4; }
.mois-case.aujourdhui { border-color: var(--accent-dark); background: var(--ok-bg); }
.mois-jour-num { font-size: 12px; font-weight: 700; }
.mois-badge { align-self: flex-start; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 8px; }
.mois-badge.badge-complet { background: var(--ok-bg); color: var(--accent-dark); }
.mois-badge.badge-attente { background: var(--bg); color: var(--gray); }
.mois-badge.badge-manque { background: var(--warn-bg); color: var(--warn); }
.mois-legende { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 11px; color: var(--gray); }
.mois-legende span { display: inline-flex; align-items: center; gap: 6px; }
.mois-legende i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* VUE LOCAUX : cartes */
.locaux-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.local-carte { background: var(--white); border-radius: 10px; padding: 16px 18px; box-shadow: 0 2px 12px rgba(31,59,68,0.05); }
.local-carte-entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.local-carte-nom { font-weight: 700; font-size: 14px; cursor: pointer; }
.local-carte-nom:hover { text-decoration: underline; }
.local-carte-meta { font-size: 11px; color: var(--gray); margin-top: 2px; }
.local-carte-stats { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.stat-puce { background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 11px; }
.stat-puce b { display: block; font-size: 13px; }
.badge-conformite { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.badge-ok { background: var(--ok-bg); color: var(--accent-dark); }
.badge-ko { background: var(--warn-bg); color: var(--warn); }

.local-carte hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.supplement-ligne { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.supplement-ligne input[type=text] { flex: 1; }
.supplement-ligne input[type=number] { width: 80px; }
.supplement-ligne button { background: none; border: none; color: var(--gray); cursor: pointer; font-size: 15px; }
.supplement-ligne button:hover { color: var(--warn); }
.btn-add-sup { margin-top: 4px; font-size: 11px; background: none; border: 1.5px dashed var(--accent); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--dark); width: 100%; }
.local-carte-total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-weight: 700; font-size: 15px; }
.local-carte-total span:first-child { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--gray); }

input[type=text], input[type=number], input[type=time], select {
  font-family: 'Inter', sans-serif; font-size: 12.5px; color: var(--dark);
  border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--white);
}
input:focus, select:focus { outline: none; border-color: var(--accent-dark); }
label { display: block; font-size: 10.5px; color: var(--gray); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

/* TOTAL GENERAL */
.total-general {
  background: var(--dark); color: var(--white); border-radius: 10px; padding: 18px 24px;
  display: flex; justify-content: space-between; align-items: center; margin-top: 20px;
}
.total-general .label { font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; color: rgba(255,255,255,0.7); }
.total-general .montant { font-size: 24px; font-weight: 700; }

/* MODALES */
.overlay { position: fixed; inset: 0; background: rgba(31,59,68,0.45); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
.modale { background: var(--white); border-radius: 12px; padding: 24px 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow: auto; box-shadow: 0 10px 60px rgba(0,0,0,0.25); }
.modale h3 { font-size: 15px; margin-bottom: 4px; }
.modale .sous-titre { font-size: 11.5px; color: var(--gray); margin-bottom: 18px; }
.champ { margin-bottom: 14px; }
.champ input, .champ select { width: 100%; }
.champ-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.jours-semaine { display: flex; gap: 6px; flex-wrap: wrap; }
.jour-toggle { padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 11.5px; user-select: none; }
.jour-toggle.actif { background: var(--accent); border-color: var(--accent); font-weight: 700; }
.forfait-preview { background: var(--bg); border-radius: 8px; padding: 12px 14px; margin: 14px 0; }
.forfait-preview .montant { font-size: 20px; font-weight: 700; color: var(--dark); }
.forfait-preview .detail { font-size: 10.5px; color: var(--gray); margin-top: 2px; }
.override-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 11.5px; color: var(--gray); }
.override-row input[type=checkbox] { width: auto; }
.modale-actions { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }

.popover { position: absolute; background: var(--white); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.2); padding: 16px; z-index: 600; width: 230px; }
.popover label { margin-top: 8px; }
.popover .champ-row { gap: 8px; }
.popover-actions { display: flex; justify-content: space-between; margin-top: 14px; }
.check-fait { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
.check-fait input { width: auto; }

@media (max-width: 720px) {
  .toolbar { padding: 12px 14px; }
  .contenu { padding: 16px 14px 50px; }
  .champ-row { grid-template-columns: 1fr; }
  .periode-nav .periode-label { min-width: 0; font-size: 13px; }
  .mois-grille { gap: 3px; }
  .mois-case { min-height: 48px; padding: 4px; border-radius: 6px; }
  .mois-jour-num { font-size: 10.5px; }
  .mois-badge { font-size: 9px; padding: 1px 5px; }
  .mois-entetes div { font-size: 9px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand"><strong>OptiClean</strong><span>Suivi ménage</span></div>
  <div class="onglets">
    <button class="onglet" id="ongletSemaine">Cette semaine</button>
    <button class="onglet" id="ongletMois">Le mois</button>
    <button class="onglet" id="ongletLocaux">Mes locaux</button>
  </div>
  <div class="toolbar-actions">
    <button class="btn btn-ghost" id="btnSauvegarder">Sauvegarder</button>
    <button class="btn btn-ghost" id="btnCharger">Charger</button>
    <input type="file" id="inputCharger" accept="application/json" />
  </div>
</div>

<div class="contenu" id="contenu">
  <!-- rempli en JavaScript -->
</div>

<div id="modales"></div>

<script>
(function () {
  "use strict";

  /* ---------- Modèle de tarification OptiClean ---------- */
  var TARIFS_ENGAGEMENT = { "12": 36, "6": 40, "0": 43 };
  var LABEL_ENGAGEMENT = { "12": "Engagement 12 mois", "6": "Engagement 6 mois", "0": "Sans engagement" };
  var SEMAINES_PAR_MOIS = 52 / 12;
  var RYTHMES = [
    { id: "2mois", label: "2 passages / mois", joursParSemaine: null, remise: 0 },
    { id: "1sem", label: "1 passage / semaine", joursParSemaine: 1, remise: 0 },
    { id: "2sem", label: "2 passages / semaine", joursParSemaine: 2, remise: 0.05 },
    { id: "3sem", label: "3 passages / semaine", joursParSemaine: 3, remise: 0.09 },
    { id: "4sem", label: "4 passages / semaine", joursParSemaine: 4, remise: 0.11 },
    { id: "5sem", label: "5 passages / semaine", joursParSemaine: 5, remise: 0.14 },
    { id: "6sem", label: "6 passages / semaine", joursParSemaine: 6, remise: 0.17 },
    { id: "7sem", label: "7 passages / semaine", joursParSemaine: 7, remise: 0.20 }
  ];
  var JOURS_LABEL = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"]; // 0=lundi ... 6=dimanche
  var JOURS_NOM_COMPLET = ["lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi", "dimanche"];
  var NOMS_MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  var NOMS_MOIS_COURT = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];

  function rythmeParId(id) {
    for (var i = 0; i < RYTHMES.length; i++) if (RYTHMES[i].id === id) return RYTHMES[i];
    return RYTHMES[0];
  }

  function tempsEstimeHeures(surface) {
    surface = Number(surface) || 0;
    var n = Math.ceil(surface / 75) || 1;
    return 0.5 * n + 0.5;
  }

  function passagesParMoisMoyen(rythmeId) {
    if (rythmeId === "2mois") return 2;
    var r = rythmeParId(rythmeId);
    return r.joursParSemaine * SEMAINES_PAR_MOIS;
  }

  function forfaitCalcule(local) {
    var temps = tempsEstimeHeures(local.surface);
    var tarifH = TARIFS_ENGAGEMENT[local.engagement] || 0;
    var rythme = rythmeParId(local.rythme);
    var passages = passagesParMoisMoyen(local.rythme);
    return Math.round(temps * tarifH * passages * (1 - rythme.remise) * 100) / 100;
  }

  function forfaitEffectif(local) {
    if (local.forfaitOverride !== null && local.forfaitOverride !== undefined && local.forfaitOverride !== "") {
      return Number(local.forfaitOverride);
    }
    return forfaitCalcule(local);
  }

  /* ---------- Stockage ---------- */
  var CLE_STOCKAGE = "opticlean-suivi-menage-v1";

  function donneesParDefaut() {
    return { version: 1, locaux: [], mois: {} };
  }

  function chargerDepuisNavigateur() {
    try {
      var brut = window.localStorage.getItem(CLE_STOCKAGE);
      if (!brut) return donneesParDefaut();
      var parsed = JSON.parse(brut);
      if (!parsed || !parsed.locaux) return donneesParDefaut();
      return parsed;
    } catch (e) {
      console.warn("Lecture des données locales impossible, on repart à vide.", e);
      return donneesParDefaut();
    }
  }

  function sauvegarderDansNavigateur() {
    try {
      window.localStorage.setItem(CLE_STOCKAGE, JSON.stringify(etat.data));
    } catch (e) {
      console.warn("Sauvegarde locale impossible (navigateur).", e);
    }
  }

  function idUnique() {
    return "l" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function getMoisData(moisISO) {
    if (!etat.data.mois[moisISO]) {
      etat.data.mois[moisISO] = { passages: {}, supplements: {} };
    }
    var m = etat.data.mois[moisISO];
    if (!m.passages) m.passages = {};
    if (!m.supplements) m.supplements = {};
    return m;
  }

  function persister() {
    sauvegarderDansNavigateur();
  }

  /* ---------- Aides dates ---------- */
  function pad2(n) { return String(n).padStart(2, "0"); }

  function dateVersISO(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function isoVersDate(iso) {
    var p = iso.split("-");
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function moisDeISO(iso) {
    return iso.slice(0, 7);
  }

  function jourSemaineLundi0DeDate(d) {
    return (d.getDay() + 6) % 7; // 0=lundi..6=dimanche
  }

  function ajouterJoursISO(iso, n) {
    var d = isoVersDate(iso);
    d.setDate(d.getDate() + n);
    return dateVersISO(d);
  }

  function aujourdHuiISO() {
    return dateVersISO(new Date());
  }

  function lundiDeLaSemaineISO(iso) {
    var d = isoVersDate(iso);
    var decalage = jourSemaineLundi0DeDate(d);
    d.setDate(d.getDate() - decalage);
    return dateVersISO(d);
  }

  function datesDeLaSemaine(lundiISO) {
    var out = [];
    for (var i = 0; i < 7; i++) out.push(ajouterJoursISO(lundiISO, i));
    return out;
  }

  function formatDateCourte(iso) {
    var d = isoVersDate(iso);
    return d.getDate() + " " + NOMS_MOIS_COURT[d.getMonth()];
  }

  function formatDateLongue(iso) {
    var d = isoVersDate(iso);
    return JOURS_NOM_COMPLET[jourSemaineLundi0DeDate(d)] + " " + d.getDate() + " " + NOMS_MOIS[d.getMonth()];
  }

  function decomposerMoisISO(moisISO) {
    var parts = moisISO.split("-");
    return { annee: Number(parts[0]), moisIndex: Number(parts[1]) - 1 };
  }

  function nbJoursDansMois(annee, moisIndex) {
    return new Date(annee, moisIndex + 1, 0).getDate();
  }

  function decalerMois(moisISO, delta) {
    var d = decomposerMoisISO(moisISO);
    var total = d.annee * 12 + d.moisIndex + delta;
    var annee = Math.floor(total / 12);
    var moisIndex = ((total % 12) + 12) % 12;
    return annee + "-" + pad2(moisIndex + 1);
  }

  function ajouterMinutes(heureStr, minutes) {
    var parts = heureStr.split(":");
    var h = Number(parts[0]), m = Number(parts[1]);
    var total = h * 60 + m + minutes;
    total = ((total % 1440) + 1440) % 1440;
    var hh = Math.floor(total / 60), mm = total % 60;
    return pad2(hh) + ":" + pad2(mm);
  }

  function heureVersMinutes(heureStr) {
    if (!heureStr) return null;
    var parts = heureStr.split(":");
    return Number(parts[0]) * 60 + Number(parts[1]);
  }

  function formatMontant(n) {
    return (Math.round((n || 0) * 100) / 100).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }

  function formatDuree(minutes) {
    if (!minutes && minutes !== 0) return "";
    var h = Math.floor(minutes / 60), m = Math.round(minutes % 60);
    if (m === 0) return h + " h";
    return h + " h " + pad2(m);
  }

  function escHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; });
  }
  function escAttr(s) {
    return escHtml(s).replace(/"/g, "&quot;");
  }

  /* ---------- Passage : lecture / écriture ---------- */
  function getPassage(localId, dateISO) {
    var m = getMoisData(moisDeISO(dateISO));
    if (!m.passages[localId]) return null;
    return m.passages[localId][dateISO] || null;
  }

  function ensurePassage(localId, dateISO) {
    var m = getMoisData(moisDeISO(dateISO));
    if (!m.passages[localId]) m.passages[localId] = {};
    if (!m.passages[localId][dateISO]) m.passages[localId][dateISO] = { fait: false, heureDebut: "", heureFin: "" };
    return m.passages[localId][dateISO];
  }

  function supprimerPassage(localId, dateISO) {
    var m = getMoisData(moisDeISO(dateISO));
    if (m.passages[localId]) delete m.passages[localId][dateISO];
  }

  /* ---------- Contrat : un local est-il prévu ce jour-là ? ---------- */
  function localPrevuCeJour(local, dateISO) {
    if (local.rythme === "2mois") return false; // pas de génération automatique, dates libres
    var wd = jourSemaineLundi0DeDate(isoVersDate(dateISO));
    return (local.joursPrevus || []).indexOf(wd) !== -1;
  }

  function joursPrevusDuMois(local, annee, moisIndex) {
    var nbJours = nbJoursDansMois(annee, moisIndex);
    var joursOuverts = [];
    if (local.rythme === "2mois") return [];
    for (var j = 1; j <= nbJours; j++) {
      var iso = annee + "-" + pad2(moisIndex + 1) + "-" + pad2(j);
      if (localPrevuCeJour(local, iso)) joursOuverts.push(j);
    }
    return joursOuverts;
  }

  function nombrePassagesPrevusMois(local, annee, moisIndex) {
    if (local.rythme === "2mois") return 2;
    return joursPrevusDuMois(local, annee, moisIndex).length;
  }

  /* ---------- État ---------- */
  var etat = {
    data: chargerDepuisNavigateur(),
    vue: "semaine",
    semaineCourante: lundiDeLaSemaineISO(aujourdHuiISO()),
    moisAffiche: aujourdHuiISO().slice(0, 7)
  };

  /* ---------- Rendu général ---------- */
  var elContenu = document.getElementById("contenu");
  var elModales = document.getElementById("modales");

  function render() {
    document.getElementById("ongletSemaine").classList.toggle("actif", etat.vue === "semaine");
    document.getElementById("ongletMois").classList.toggle("actif", etat.vue === "mois");
    document.getElementById("ongletLocaux").classList.toggle("actif", etat.vue === "locaux");

    if (etat.data.locaux.length === 0) {
      elContenu.innerHTML =
        '<div class="bandeau-vide">' +
        "<p>Aucun local pour l'instant.</p>" +
        '<button class="btn btn-accent" id="btnPremierLocal">+ Ajouter le premier local</button>' +
        "</div>";
      document.getElementById("btnPremierLocal").onclick = function () { ouvrirModaleLocal(null); };
      return;
    }

    if (etat.vue === "locaux") {
      renderVueLocaux();
    } else if (etat.vue === "mois") {
      renderVueMois();
    } else {
      renderVueSemaine();
    }
  }

  /* ================= VUE SEMAINE (agenda) ================= */
  function renderVueSemaine() {
    var dates = datesDeLaSemaine(etat.semaineCourante);
    var aujourdhui = aujourdHuiISO();
    var premier = isoVersDate(dates[0]), dernier = isoVersDate(dates[6]);
    var libelle;
    if (premier.getMonth() === dernier.getMonth()) {
      libelle = "Semaine du " + premier.getDate() + " au " + dernier.getDate() + " " + NOMS_MOIS[premier.getMonth()];
    } else {
      libelle = "Semaine du " + premier.getDate() + " " + NOMS_MOIS_COURT[premier.getMonth()] + " au " + dernier.getDate() + " " + NOMS_MOIS_COURT[dernier.getMonth()];
    }

    var html = '<div class="avertissement"><strong>Rappel :</strong> les données restent dans ce navigateur, sur cet ordinateur. Pensez à cliquer sur « Sauvegarder » régulièrement pour garder un fichier de secours.</div>';

    html += '<div class="periode-nav">' +
      '<button class="rond" id="semainePrev" title="Semaine précédente">‹</button>' +
      '<div><div class="periode-label">' + libelle + '</div>' + (etat.semaineCourante !== lundiDeLaSemaineISO(aujourdhui) ? '<div style="text-align:center"><button class="lien-aujourdhui" id="btnAujourdhui">revenir à aujourd\'hui</button></div>' : '') + '</div>' +
      '<button class="rond" id="semaineNext" title="Semaine suivante">›</button>' +
      "</div>";

    dates.forEach(function (iso) {
      var estAujourdhui = iso === aujourdhui;
      var entrees = entreesDuJour(iso);
      var nbFaites = entrees.filter(function (e) { return e.passage && e.passage.fait; }).length;

      html += '<div class="jour-bloc' + (estAujourdhui ? " aujourdhui" : "") + '">';
      html += '<div class="jour-entete"><div class="jour-nom">' + formatDateLongue(iso) + (estAujourdhui ? '<span class="jour-tag-aujourdhui">Aujourd\'hui</span>' : '') + '</div>';
      html += '<div class="jour-compte">' + (entrees.length ? (nbFaites + " / " + entrees.length + " faits") : "") + '</div></div>';
      html += '<div class="jour-corps">';

      if (entrees.length === 0) {
        html += '<div class="jour-vide">Aucun passage prévu ce jour</div>';
      } else {
        entrees.forEach(function (e) {
          var fait = !!(e.passage && e.passage.fait);
          var heures = (e.passage && e.passage.heureDebut && e.passage.heureFin) ? (e.passage.heureDebut + " à " + e.passage.heureFin) : "";
          html += '<div class="entree' + (fait ? " fait" : "") + '" data-entree data-local="' + e.local.id + '" data-date="' + iso + '">';
          html += '<div class="entree-check" data-check>' + (fait ? "✓" : "") + '</div>';
          html += '<div class="entree-corps"><div class="entree-nom">' + escHtml(e.local.nom) + (e.manuel ? '<span class="entree-manuelle-tag">ajouté</span>' : '') + '</div>';
          if (heures) html += '<div class="entree-heures">' + heures + '</div>';
          html += '</div>';
          if (e.manuel) html += '<button class="entree-suppr" data-suppr-entree title="Retirer">×</button>';
          html += '</div>';
        });
      }

      var localsRestants = etat.data.locaux.filter(function (l) {
        return !entrees.some(function (e) { return e.local.id === l.id; });
      });
      if (localsRestants.length) {
        html += '<div class="ajout-jour"><select data-ajout-select data-date="' + iso + '">' +
          '<option value="">+ Ajouter un local à ce jour</option>' +
          localsRestants.map(function (l) { return '<option value="' + l.id + '">' + escHtml(l.nom) + '</option>'; }).join("") +
          '</select></div>';
      }

      html += "</div></div>";
    });

    elContenu.innerHTML = html;
    attacherEvenementsSemaine();
  }

  function entreesDuJour(iso) {
    var out = [];
    etat.data.locaux.forEach(function (local) {
      var prevu = localPrevuCeJour(local, iso);
      var passage = getPassage(local.id, iso);
      if (prevu || passage) {
        out.push({ local: local, passage: passage, manuel: !prevu });
      }
    });
    return out;
  }

  function attacherEvenementsSemaine() {
    document.getElementById("semainePrev").addEventListener("click", function () {
      etat.semaineCourante = ajouterJoursISO(etat.semaineCourante, -7); render();
    });
    document.getElementById("semaineNext").addEventListener("click", function () {
      etat.semaineCourante = ajouterJoursISO(etat.semaineCourante, 7); render();
    });
    var btnAuj = document.getElementById("btnAujourdhui");
    if (btnAuj) btnAuj.addEventListener("click", function () {
      etat.semaineCourante = lundiDeLaSemaineISO(aujourdHuiISO()); render();
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-check]"), function (el) {
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var entree = el.closest("[data-entree]");
        basculerFait(entree.getAttribute("data-local"), entree.getAttribute("data-date"));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-suppr-entree]"), function (el) {
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var entree = el.closest("[data-entree]");
        supprimerPassage(entree.getAttribute("data-local"), entree.getAttribute("data-date"));
        persister(); render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-entree]"), function (el) {
      el.addEventListener("click", function () {
        ouvrirPopoverPassage(el, el.getAttribute("data-local"), el.getAttribute("data-date"));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-ajout-select]"), function (sel) {
      sel.addEventListener("change", function () {
        if (!sel.value) return;
        ensurePassage(sel.value, sel.getAttribute("data-date"));
        persister(); render();
      });
    });
  }

  function basculerFait(localId, dateISO) {
    var p = ensurePassage(localId, dateISO);
    p.fait = !p.fait;
    if (p.fait && !p.heureDebut) {
      var local = etat.data.locaux.find(function (l) { return l.id === localId; });
      p.heureDebut = "09:00";
      p.heureFin = ajouterMinutes("09:00", Math.round(tempsEstimeHeures(local.surface) * 60));
    }
    persister(); render();
  }

  /* ---------- Popover détail d'un passage ---------- */
  function ouvrirPopoverPassage(ancre, localId, iso) {
    fermerPopover();
    var local = etat.data.locaux.find(function (l) { return l.id === localId; });
    var passage = getPassage(localId, iso) || { fait: false, heureDebut: "", heureFin: "" };

    var rect = ancre.getBoundingClientRect();
    var pop = document.createElement("div");
    pop.className = "popover";
    pop.style.top = (window.scrollY + rect.bottom + 6) + "px";
    pop.style.left = (window.scrollX + Math.min(rect.left, window.innerWidth - 250)) + "px";

    pop.innerHTML =
      '<div style="font-weight:700;font-size:12.5px;margin-bottom:8px">' + escHtml(local.nom) + "</div>" +
      '<label class="check-fait"><input type="checkbox" id="popFait" ' + (passage.fait ? "checked" : "") + "> Ménage fait</label>" +
      '<div class="champ-row" style="margin-top:10px">' +
      '<div><label>Heure de début</label><input type="time" id="popDebut" value="' + (passage.heureDebut || "") + '" /></div>' +
      '<div><label>Heure de fin</label><input type="time" id="popFin" value="' + (passage.heureFin || "") + '" /></div>' +
      "</div>" +
      '<div class="popover-actions">' +
      '<button class="btn btn-outline" id="popFermer">Fermer</button>' +
      '<button class="btn btn-accent" id="popEnregistrer">Enregistrer</button>' +
      "</div>";
    elModales.appendChild(pop);

    var champDebut = pop.querySelector("#popDebut");
    var champFin = pop.querySelector("#popFin");
    champDebut.addEventListener("change", function () {
      if (champDebut.value && !champFin.value && local) {
        var minutes = Math.round(tempsEstimeHeures(local.surface) * 60);
        champFin.value = ajouterMinutes(champDebut.value, minutes);
      }
    });

    pop.querySelector("#popFermer").onclick = fermerPopover;
    pop.querySelector("#popEnregistrer").onclick = function () {
      var p = ensurePassage(localId, iso);
      p.fait = pop.querySelector("#popFait").checked;
      p.heureDebut = champDebut.value || "";
      p.heureFin = champFin.value || "";
      persister();
      fermerPopover();
      render();
    };

    setTimeout(function () { document.addEventListener("mousedown", clicExterieurPopover); }, 0);
  }

  function clicExterieurPopover(ev) {
    var pop = document.querySelector(".popover");
    if (pop && !pop.contains(ev.target)) fermerPopover();
  }

  function fermerPopover() {
    document.removeEventListener("mousedown", clicExterieurPopover);
    var pop = document.querySelector(".popover");
    if (pop) pop.remove();
  }

  /* ================= VUE MOIS (calendrier) ================= */
  function semainesDuMoisGrille(moisISO) {
    var d = decomposerMoisISO(moisISO);
    var premierJour = moisISO + "-01";
    var dernierJour = moisISO + "-" + pad2(nbJoursDansMois(d.annee, d.moisIndex));
    var lundiDebut = lundiDeLaSemaineISO(premierJour);
    var lundiFin = lundiDeLaSemaineISO(dernierJour);
    var semaines = [];
    var curseur = lundiDebut;
    while (true) {
      semaines.push(datesDeLaSemaine(curseur));
      if (curseur === lundiFin) break;
      curseur = ajouterJoursISO(curseur, 7);
    }
    return semaines;
  }

  function renderVueMois() {
    var d = decomposerMoisISO(etat.moisAffiche);
    var aujourdhui = aujourdHuiISO();
    var semaines = semainesDuMoisGrille(etat.moisAffiche);

    var html = '<div class="periode-nav">' +
      '<button class="rond" id="moisVuePrev" title="Mois précédent">‹</button>' +
      '<div class="periode-label">' + NOMS_MOIS[d.moisIndex] + " " + d.annee + '</div>' +
      '<button class="rond" id="moisVueNext" title="Mois suivant">›</button>' +
      "</div>";

    html += '<div class="mois-entetes">' + JOURS_LABEL.map(function (l) { return "<div>" + l + "</div>"; }).join("") + "</div>";
    html += '<div class="mois-grille">';

    semaines.forEach(function (semaine) {
      semaine.forEach(function (iso) {
        var horsMois = moisDeISO(iso) !== etat.moisAffiche;
        var estAujourdhui = iso === aujourdhui;
        var entrees = entreesDuJour(iso);
        var jourNum = isoVersDate(iso).getDate();

        var classes = "mois-case" + (horsMois ? " hors-mois" : "") + (estAujourdhui ? " aujourdhui" : "");
        html += '<div class="' + classes + '" data-mois-case data-date="' + iso + '">';
        html += '<div class="mois-jour-num">' + jourNum + "</div>";

        if (entrees.length) {
          var nbFait = entrees.filter(function (e) { return e.passage && e.passage.fait; }).length;
          var badgeClasse, badgeTexte;
          if (nbFait >= entrees.length) { badgeClasse = "badge-complet"; badgeTexte = "fait"; }
          else if (iso < aujourdhui) { badgeClasse = "badge-manque"; badgeTexte = nbFait + "/" + entrees.length; }
          else { badgeClasse = "badge-attente"; badgeTexte = nbFait + "/" + entrees.length; }
          html += '<div class="mois-badge ' + badgeClasse + '">' + badgeTexte + "</div>";
        }

        html += "</div>";
      });
    });

    html += "</div>";

    html += '<div class="mois-legende">' +
      '<span><i style="background:var(--ok-bg);border:1.5px solid var(--accent-dark)"></i>Tous les passages faits</span>' +
      '<span><i style="background:var(--bg)"></i>Encore à venir</span>' +
      '<span><i style="background:var(--warn-bg)"></i>Jour passé incomplet</span>' +
      "</div>";

    elContenu.innerHTML = html;
    attacherEvenementsMois();
  }

  function attacherEvenementsMois() {
    document.getElementById("moisVuePrev").addEventListener("click", function () { etat.moisAffiche = decalerMois(etat.moisAffiche, -1); render(); });
    document.getElementById("moisVueNext").addEventListener("click", function () { etat.moisAffiche = decalerMois(etat.moisAffiche, 1); render(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-mois-case]"), function (el) {
      el.addEventListener("click", function () {
        var iso = el.getAttribute("data-date");
        etat.semaineCourante = lundiDeLaSemaineISO(iso);
        etat.vue = "semaine";
        render();
      });
    });
  }

  /* ================= VUE LOCAUX (comptabilité mensuelle) ================= */
  function renderVueLocaux() {
    var d = decomposerMoisISO(etat.moisAffiche);
    var moisData = getMoisData(etat.moisAffiche);

    var html = '<div class="periode-nav">' +
      '<button class="rond" id="moisPrev" title="Mois précédent">‹</button>' +
      '<div class="periode-label">' + NOMS_MOIS[d.moisIndex] + " " + d.annee + '</div>' +
      '<button class="rond" id="moisNext" title="Mois suivant">›</button>' +
      "</div>";

    html += '<div style="text-align:right;margin-bottom:14px"><button class="btn btn-accent btn-petit" id="btnNouveauLocal">+ Nouveau local</button></div>';

    html += '<div class="locaux-grid">';
    var total = 0;
    etat.data.locaux.forEach(function (local) {
      var nbPrevu = nombrePassagesPrevusMois(local, d.annee, d.moisIndex);
      var passagesLocal = (moisData.passages[local.id] || {});
      var nbFait = 0, dureeReelleMin = 0;
      Object.keys(passagesLocal).forEach(function (iso) {
        if (moisDeISO(iso) !== etat.moisAffiche) return;
        var p = passagesLocal[iso];
        if (p && p.fait) {
          nbFait++;
          if (p.heureDebut && p.heureFin) dureeReelleMin += Math.max(0, heureVersMinutes(p.heureFin) - heureVersMinutes(p.heureDebut));
        }
      });
      var dureePrevueMin = tempsEstimeHeures(local.surface) * 60 * nbPrevu;
      var forfait = forfaitEffectif(local);
      var lignesSup = moisData.supplements[local.id] || [];
      var totalSup = lignesSup.reduce(function (s, x) { return s + (Number(x.montant) || 0); }, 0);
      var totalLocal = forfait + totalSup;
      total += totalLocal;
      var conforme = nbFait >= nbPrevu;

      html += '<div class="local-carte">';
      html += '<div class="local-carte-entete"><div><div class="local-carte-nom" data-edit-local="' + local.id + '">' + escHtml(local.nom) + '</div>';
      html += '<div class="local-carte-meta">' + local.surface + " m² · " + LABEL_ENGAGEMENT[local.engagement] + " · " + rythmeParId(local.rythme).label + '</div></div>';
      html += '<span class="badge-conformite ' + (conforme ? "badge-ok" : "badge-ko") + '">' + nbFait + " / " + nbPrevu + '</span></div>';
      html += '<div class="local-carte-stats">';
      html += '<div class="stat-puce">Durée faite<b>' + (formatDuree(dureeReelleMin) || "0 h") + '</b></div>';
      html += '<div class="stat-puce">Durée prévue<b>' + formatDuree(dureePrevueMin) + '</b></div>';
      html += '</div>';

      html += '<hr><div class="local-carte-total"><span>Forfait</span><span>' + formatMontant(forfait) + '</span></div>';

      html += '<div style="margin-top:10px" data-sup-local="' + local.id + '">';
      lignesSup.forEach(function (ligne, idx) {
        html += '<div class="supplement-ligne">' +
          '<input type="text" data-sup-nom data-idx="' + idx + '" value="' + escAttr(ligne.nom) + '" placeholder="Ex : vitres" />' +
          '<input type="number" step="0.01" data-sup-montant data-idx="' + idx + '" value="' + (ligne.montant != null ? ligne.montant : "") + '" placeholder="€" />' +
          '<button data-sup-suppr data-idx="' + idx + '" title="Retirer">×</button>' +
          "</div>";
      });
      html += '<button class="btn-add-sup" data-sup-ajouter>+ Ajouter un supplément</button></div>';

      html += '<hr><div class="local-carte-total"><span>Total du mois</span><span>' + formatMontant(totalLocal) + '</span></div>';
      html += "</div>";
    });
    html += "</div>";

    html += '<div class="total-general"><div class="label">Total général du mois</div><div class="montant">' + formatMontant(total) + "</div></div>";

    elContenu.innerHTML = html;
    attacherEvenementsLocaux();
  }

  function attacherEvenementsLocaux() {
    document.getElementById("moisPrev").addEventListener("click", function () { etat.moisAffiche = decalerMois(etat.moisAffiche, -1); render(); });
    document.getElementById("moisNext").addEventListener("click", function () { etat.moisAffiche = decalerMois(etat.moisAffiche, 1); render(); });
    document.getElementById("btnNouveauLocal").addEventListener("click", function () { ouvrirModaleLocal(null); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-edit-local]"), function (el) {
      el.addEventListener("click", function () { ouvrirModaleLocal(el.getAttribute("data-edit-local")); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sup-ajouter]"), function (btn) {
      btn.addEventListener("click", function () {
        var localId = btn.closest("[data-sup-local]").getAttribute("data-sup-local");
        var moisData = getMoisData(etat.moisAffiche);
        if (!moisData.supplements[localId]) moisData.supplements[localId] = [];
        moisData.supplements[localId].push({ nom: "", montant: "" });
        persister(); render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sup-suppr]"), function (btn) {
      btn.addEventListener("click", function () {
        var carte = btn.closest("[data-sup-local]");
        var localId = carte.getAttribute("data-sup-local");
        var idx = Number(btn.getAttribute("data-idx"));
        var moisData = getMoisData(etat.moisAffiche);
        moisData.supplements[localId].splice(idx, 1);
        persister(); render();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-sup-nom], [data-sup-montant]"), function (input) {
      input.addEventListener("change", function () { majSupplement(input); });
    });
  }

  function majSupplement(input) {
    var carte = input.closest("[data-sup-local]");
    var localId = carte.getAttribute("data-sup-local");
    var idx = Number(input.getAttribute("data-idx"));
    var moisData = getMoisData(etat.moisAffiche);
    var ligne = moisData.supplements[localId][idx];
    if (input.hasAttribute("data-sup-nom")) ligne.nom = input.value;
    if (input.hasAttribute("data-sup-montant")) ligne.montant = input.value === "" ? "" : Number(input.value);
    persister(); render();
  }

  /* ---------- Modale local (création / édition) ---------- */
  function ouvrirModaleLocal(localId) {
    var local = localId ? etat.data.locaux.find(function (l) { return l.id === localId; }) : null;
    var brouillon = local ? Object.assign({}, local, { joursPrevus: (local.joursPrevus || []).slice() }) : {
      id: null, nom: "", surface: 100, engagement: "12", rythme: "1sem", joursPrevus: [0],
      forfaitOverride: null
    };

    var overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML =
      '<div class="modale">' +
      "<h3>" + (local ? "Modifier le local" : "Nouveau local") + "</h3>" +
      '<div class="sous-titre">Le forfait mensuel se calcule automatiquement selon la grille tarifaire OptiClean.</div>' +
      '<div class="champ"><label>Nom du local</label><input type="text" id="champNom" value="' + escAttr(brouillon.nom) + '" placeholder="Ex : Cabinet Dupont" /></div>' +
      '<div class="champ-row">' +
      '<div class="champ"><label>Surface (m²)</label><input type="number" id="champSurface" min="1" value="' + brouillon.surface + '" /></div>' +
      '<div class="champ"><label>Engagement</label><select id="champEngagement">' +
      '<option value="12"' + (brouillon.engagement === "12" ? " selected" : "") + ">12 mois (36 € HT/h)</option>" +
      '<option value="6"' + (brouillon.engagement === "6" ? " selected" : "") + ">6 mois (40 € HT/h)</option>" +
      '<option value="0"' + (brouillon.engagement === "0" ? " selected" : "") + ">Sans engagement (43 € HT/h)</option>" +
      "</select></div>" +
      "</div>" +
      '<div class="champ"><label>Rythme de passage</label><select id="champRythme">' +
      RYTHMES.map(function (r) { return '<option value="' + r.id + '"' + (brouillon.rythme === r.id ? " selected" : "") + ">" + r.label + (r.remise ? " (" + Math.round(r.remise * 100) + " % de remise)" : "") + "</option>"; }).join("") +
      "</select></div>" +
      '<div class="champ" id="blocJours"><label>Jours de passage prévus</label><div class="jours-semaine">' +
      JOURS_LABEL.map(function (lbl, i) { return '<div class="jour-toggle" data-jour-toggle="' + i + '">' + lbl + "</div>"; }).join("") +
      "</div></div>" +
      '<div class="forfait-preview" id="apercuForfait"></div>' +
      '<div class="override-row"><input type="checkbox" id="champOverrideActif" ' + (brouillon.forfaitOverride !== null && brouillon.forfaitOverride !== undefined ? "checked" : "") + '> Remplacer par un montant négocié à la main</div>' +
      '<div class="champ" id="blocOverride" style="display:none;margin-top:8px"><input type="number" step="0.01" id="champOverride" value="' + (brouillon.forfaitOverride || "") + '" placeholder="Montant en €" /></div>' +
      '<div class="modale-actions">' +
      (local ? '<button class="btn btn-danger" id="btnSupprimerLocal">Supprimer ce local</button>' : "<div></div>") +
      '<div style="display:flex;gap:8px"><button class="btn btn-outline" id="btnAnnulerLocal">Annuler</button><button class="btn btn-accent" id="btnValiderLocal">Enregistrer</button></div>' +
      "</div>" +
      "</div>";
    elModales.appendChild(overlay);

    function majJoursToggles() {
      Array.prototype.forEach.call(overlay.querySelectorAll("[data-jour-toggle]"), function (el) {
        var i = Number(el.getAttribute("data-jour-toggle"));
        el.classList.toggle("actif", brouillon.joursPrevus.indexOf(i) !== -1);
      });
      overlay.querySelector("#blocJours").style.display = (overlay.querySelector("#champRythme").value === "2mois") ? "none" : "";
    }
    function majApercu() {
      var f = forfaitCalcule(brouillon);
      var temps = tempsEstimeHeures(brouillon.surface);
      var overrideActif = overlay.querySelector("#champOverrideActif").checked;
      var overlayMontant = overrideActif ? Number(overlay.querySelector("#champOverride").value || 0) : f;
      overlay.querySelector("#apercuForfait").innerHTML =
        '<div class="montant">' + formatMontant(overlayMontant) + " / mois</div>" +
        '<div class="detail">Calcul grille : ' + formatMontant(f) + " · temps estimé " + temps + " h par passage" + (overrideActif ? " (montant remplacé juste en dessous)" : "") + "</div>";
    }

    majJoursToggles();
    majApercu();

    Array.prototype.forEach.call(overlay.querySelectorAll("[data-jour-toggle]"), function (el) {
      el.addEventListener("click", function () {
        var i = Number(el.getAttribute("data-jour-toggle"));
        var pos = brouillon.joursPrevus.indexOf(i);
        if (pos === -1) brouillon.joursPrevus.push(i); else brouillon.joursPrevus.splice(pos, 1);
        majJoursToggles();
      });
    });
    overlay.querySelector("#champSurface").addEventListener("input", function (e) { brouillon.surface = Number(e.target.value) || 0; majApercu(); });
    overlay.querySelector("#champEngagement").addEventListener("change", function (e) { brouillon.engagement = e.target.value; majApercu(); });
    overlay.querySelector("#champRythme").addEventListener("change", function (e) { brouillon.rythme = e.target.value; majJoursToggles(); majApercu(); });
    overlay.querySelector("#champOverrideActif").addEventListener("change", function (e) {
      overlay.querySelector("#blocOverride").style.display = e.target.checked ? "" : "none";
      majApercu();
    });
    overlay.querySelector("#champOverride").addEventListener("input", majApercu);

    overlay.querySelector("#btnAnnulerLocal").onclick = function () { overlay.remove(); };
    overlay.addEventListener("mousedown", function (e) { if (e.target === overlay) overlay.remove(); });

    if (local) {
      overlay.querySelector("#btnSupprimerLocal").onclick = function () {
        if (!confirm("Supprimer définitivement « " + local.nom + " » et tout son suivi ? Cette action ne peut pas être annulée.")) return;
        etat.data.locaux = etat.data.locaux.filter(function (l) { return l.id !== local.id; });
        persister();
        overlay.remove();
        render();
      };
    }

    overlay.querySelector("#btnValiderLocal").onclick = function () {
      var nom = overlay.querySelector("#champNom").value.trim();
      if (!nom) { alert("Le nom du local est obligatoire."); return; }
      brouillon.nom = nom;
      brouillon.surface = Number(overlay.querySelector("#champSurface").value) || 0;
      brouillon.engagement = overlay.querySelector("#champEngagement").value;
      brouillon.rythme = overlay.querySelector("#champRythme").value;
      var overrideActif = overlay.querySelector("#champOverrideActif").checked;
      brouillon.forfaitOverride = overrideActif ? Number(overlay.querySelector("#champOverride").value || 0) : null;

      if (local) {
        Object.assign(local, brouillon);
      } else {
        brouillon.id = idUnique();
        etat.data.locaux.push(brouillon);
      }
      persister();
      overlay.remove();
      render();
    };
  }

  /* ---------- Sauvegarde / chargement fichier ---------- */
  function exporterFichier() {
    var blob = new Blob([JSON.stringify(etat.data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var horodatage = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "opticlean-suivi-menage-" + horodatage + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function importerFichier(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.locaux)) throw new Error("format inattendu");
        if (!confirm("Charger ce fichier va remplacer les données actuellement affichées dans ce navigateur. Continuer ?")) return;
        etat.data = parsed;
        if (!etat.data.mois) etat.data.mois = {};
        persister();
        render();
      } catch (e) {
        alert("Ce fichier ne peut pas être lu comme une sauvegarde OptiClean valide.");
      }
    };
    reader.readAsText(file);
  }

  /* ---------- Initialisation ---------- */
  document.getElementById("ongletSemaine").addEventListener("click", function () { etat.vue = "semaine"; render(); });
  document.getElementById("ongletMois").addEventListener("click", function () { etat.vue = "mois"; render(); });
  document.getElementById("ongletLocaux").addEventListener("click", function () { etat.vue = "locaux"; render(); });
  document.getElementById("btnSauvegarder").addEventListener("click", exporterFichier);
  document.getElementById("btnCharger").addEventListener("click", function () { document.getElementById("inputCharger").click(); });
  document.getElementById("inputCharger").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) importerFichier(e.target.files[0]);
    e.target.value = "";
  });

  render();
})();
</script>
</body>
</html>
